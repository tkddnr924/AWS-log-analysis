[package]
name = "awslog-analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "awslog_analyzer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
awslog-core = { path = "../crates/awslog-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = { workspace = true }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "common-controls-v6"] }
specta-typescript = "0.0.12"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
serde = { version = "1.0.229", features = ["derive"] }
parking_lot = "0.12.5"
time.workspace = true
serde_json = "1.0.151"

# Without this Tauri treats the binary as a dev build and loads `devUrl`
# (localhost:1420) instead of the embedded `frontendDist`. `cargo tauri
# build` enables it implicitly; the CI's plain `cargo build` must pass it.
[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
